name: CI

# One job, one Node version. The matrix was two extra minutes to learn what one run already says,
# and the images job belongs with the releases: a pull request does not need to build a container
# to know whether the code typechecks and its tests pass.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile --ignore-scripts
      # typecheck → kernel-checked policies → Node build → offline tests
      - run: bun run check
      # The verification pass is stdlib Python and runs child processes for real: no image, no
      # mocks, so it is cheap to run here and expensive to discover broken in a review.
      - run: python3 verify/test_verify.py
      # What the reviewer is told: inline or manifest, and never a placeholder nobody filled.
      - run: python3 review/test_render_prompt.py
      # A workflow file with a bad key is not a lint failure: GitHub refuses to run it at all, so a
      # mistake here silently turns a pipeline off. Cheap, and it reads every workflow in the repo.
      - name: Lint the workflows
        run: |
          curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash
          ./actionlint -color
